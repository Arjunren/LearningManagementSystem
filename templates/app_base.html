{% extends "base.html" %}

{% block content %}
<div class="flex h-screen overflow-hidden bg-surface-page">
    {% include 'components/sidebar.html' %}

    <div class="flex flex-col flex-1 w-0 overflow-hidden">
        {% include 'components/navbar.html' %}

        <main class="flex-1 relative z-0 overflow-y-auto scrollbar-slim focus:outline-none">
            <div class="py-8 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto w-full">
                {% block app_content %}{% endblock %}
            </div>
        </main>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function toggleSidebar() {
        const sidebar = document.getElementById('mobile-sidebar');
        if (!sidebar) return;
        const opening = sidebar.classList.contains('hidden');
        sidebar.classList.toggle('hidden');
        document.body.style.overflow = opening ? 'hidden' : '';
    }

    // Escape closes the mobile drawer
    document.addEventListener('keydown', function (event) {
        if (event.key !== 'Escape') return;
        const sidebar = document.getElementById('mobile-sidebar');
        if (sidebar && !sidebar.classList.contains('hidden')) toggleSidebar();
    });
</script>
{% block app_scripts %}{% endblock %}
{% endblock %}
