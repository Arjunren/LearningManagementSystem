{% extends "base.html" %}

{% block content %}
<div class="flex items-center justify-center flex-grow py-12 px-4 sm:px-6 lg:px-8 bg-gray-900">
    <div class="max-w-md w-full space-y-8 bg-gray-800 p-10 rounded-xl shadow-2xl border border-gray-700">
        <div>
            <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-gray-700 mb-4">
                <i class="ph ph-shield-check text-indigo-400 text-3xl"></i>
            </div>
            <h2 class="text-center text-3xl font-extrabold text-white">Admin Login</h2>
            <p class="mt-2 text-center text-sm text-gray-400">Restricted access area</p>
        </div>
        <form class="mt-8 space-y-6" action="{{ url_for('admin.login') }}" method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="rounded-md shadow-sm space-y-4">
                <div>
                    <label for="email" class="sr-only">Email address</label>
                    <input id="email" name="email" type="email" required class="appearance-none relative block w-full px-3 py-3 bg-gray-700 border border-gray-600 placeholder-gray-400 text-white rounded-lg focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm" placeholder="Admin Email">
                </div>
                <div>
                    <label for="password" class="sr-only">Password</label>
                    <input id="password" name="password" type="password" required class="appearance-none relative block w-full px-3 py-3 bg-gray-700 border border-gray-600 placeholder-gray-400 text-white rounded-lg focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 focus:z-10 sm:text-sm" placeholder="Password">
                </div>
            </div>

            <div>
                <button type="submit" class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150">
                    Sign In
                </button>
            </div>
            
            <div class="text-center mt-4">
                <a href="{{ url_for('auth.login') }}" class="text-sm text-gray-400 hover:text-white transition duration-150"><i class="ph ph-arrow-left mr-1"></i> Return to Student Portal</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
