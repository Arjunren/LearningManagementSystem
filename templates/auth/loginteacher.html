{% extends "base.html" %}
{% block page_title %}BuildByte Academy — Teacher Login{% endblock %}

{% block content %}
<div class="flex items-center justify-center flex-grow py-12 px-4 sm:px-6 lg:px-8 bg-gray-50">
    <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-xl shadow-xl border-t-4 border-emerald-500">
        <div class="text-center">
            <img src="/static/images/Icon.png" alt="BuildByte Academy" class="h-16 w-16 mx-auto mb-4" onerror="this.style.display='none'">
            <h2 class="mt-2 text-3xl font-extrabold text-gray-900">Teacher Portal</h2>
            <p class="mt-2 text-sm text-gray-600">Sign in to manage your courses and grades</p>
        </div>
        <form class="mt-8 space-y-6" action="{{ url_for('auth.loginteacher') }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="rounded-md shadow-sm space-y-4">
                <div>
                    <label for="email" class="sr-only">Email address</label>
                    <input id="email" name="email" type="email" required class="appearance-none relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-lg focus:outline-none focus:ring-emerald-500 focus:border-emerald-500 focus:z-10 sm:text-sm" placeholder="Email address">
                </div>
                <div class="relative">
                    <label for="password" class="sr-only">Password</label>
                    <input id="password" name="password" type="password" required class="appearance-none relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-lg focus:outline-none focus:ring-emerald-500 focus:border-emerald-500 focus:z-10 sm:text-sm" placeholder="Password">
                    <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-500">
                        <i class="ph ph-eye text-xl" id="eye-icon"></i>
                    </button>
                </div>
            </div>

            <div>
                <button type="submit" class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-emerald-600 hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500 transition duration-150 shadow-sm">
                    Sign In as Teacher
                </button>
            </div>
            <div class="text-right -mt-3">
                <a href="{{ url_for('auth.teacher_forgot_password') }}" class="text-sm font-medium text-emerald-700 hover:text-emerald-600">Forgot Password?</a>
            </div>
            
            <div class="text-center mt-4 pt-4 border-t border-gray-100">
                <p class="text-sm text-gray-600">
                    Are you a student? <a href="{{ url_for('auth.login') }}" class="font-medium text-blue-600 hover:text-blue-500 transition duration-150">Student Login</a>
                </p>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function togglePassword() {
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eye-icon');
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            eyeIcon.classList.remove('ph-eye');
            eyeIcon.classList.add('ph-eye-slash');
        } else {
            passwordInput.type = 'password';
            eyeIcon.classList.remove('ph-eye-slash');
            eyeIcon.classList.add('ph-eye');
        }
    }
</script>
{% endblock %}
