{% extends "base.html" %}

{% block content %}
<div class="flex items-center justify-center flex-grow py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-xl shadow-xl text-center">
        <div>
            <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-blue-100 mb-4">
                <i class="ph ph-envelope-simple-open text-blue-600 text-2xl"></i>
            </div>
            <h2 class="text-2xl font-extrabold text-gray-900">Verify Your Email</h2>
            <p class="mt-2 text-sm text-gray-600">We've sent a 6-digit verification code to <span class="font-semibold text-gray-900">{{ email }}</span></p>
        </div>
        <form class="mt-8 space-y-6" action="{{ url_for('auth.verify_otp_route') }}" method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="flex justify-center gap-2 sm:gap-3">
                {% for i in range(1, 7) %}
                <input type="text" name="digit{{ i }}" id="digit{{ i }}" maxlength="1" required class="w-10 h-12 sm:w-12 sm:h-14 text-center text-xl font-bold border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" onkeyup="moveToNext(this, 'digit{{ i+1 if i < 6 else '' }}', event)">
                {% endfor %}
            </div>

            <div>
                <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition duration-150">
                    Confirm
                </button>
            </div>
            
            <div class="text-center mt-4">
                <p class="text-sm text-gray-600">
                    Didn't receive the code? 
                    <a href="{{ url_for('auth.register') }}" class="font-medium text-blue-600 hover:text-blue-500">Resend OTP</a>
                </p>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function moveToNext(current, nextFieldID, event) {
        if (current.value.length >= current.maxLength) {
            if (nextFieldID) {
                document.getElementById(nextFieldID).focus();
            }
        }
        if (event.key === "Backspace" && current.value === "") {
            let previousSibling = current.previousElementSibling;
            if (previousSibling && previousSibling.tagName === 'INPUT') {
                previousSibling.focus();
            }
        }
    }
</script>
{% endblock %}
