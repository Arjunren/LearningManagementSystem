{% extends "base.html" %}

{% block content %}
<div class="flex items-center justify-center flex-grow py-12 px-4 sm:px-6 lg:px-8 bg-gray-50">
    <div class="max-w-md w-full bg-white p-10 rounded-2xl shadow-2xl border border-gray-100">

        <!-- Header & Logo Section -->
        <div class="text-center mb-8">
            <!-- Brand Identity -->
            <div class="flex items-center justify-center gap-3 mb-6">
                <img src="https://buildbyteacademy.vercel.app/Icon.png" alt="BuildByte Academy Logo"
                    class="w-10 h-10 object-contain drop-shadow-sm">
                <span class="font-bold text-2xl text-gray-900 tracking-tight">BuildByte Academy</span>
            </div>

            <!-- Page Title -->
            <h2 class="text-3xl font-extrabold text-gray-900 tracking-tight">Welcome Back</h2>
            <p class="mt-2 text-sm text-gray-500 font-medium">Access your student learning portal</p>
        </div>

        <form class="space-y-6" action="{{ url_for('auth.login') }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="space-y-5">
                <!-- Email Input -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1.5">Email Address</label>
                    <div class="relative rounded-md shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="ph ph-envelope text-gray-400 text-lg"></i>
                        </div>
                        <input id="email" name="email" type="email" required
                            class="appearance-none block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm transition duration-200"
                            placeholder="student@example.com">
                    </div>
                </div>

                <!-- Password Input -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
                    <div class="relative rounded-md shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="ph ph-lock text-gray-400 text-lg"></i>
                        </div>
                        <input id="password" name="password" type="password" required
                            class="appearance-none block w-full pl-10 pr-12 py-3 border border-gray-300 rounded-lg text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm transition duration-200"
                            placeholder="••••••••">
                        <button type="button" onclick="togglePassword()"
                            class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-blue-600 transition-colors duration-200 focus:outline-none">
                            <i class="ph ph-eye text-xl" id="eye-icon"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Remember Me & Forgot Password -->
            <div class="flex items-center justify-between mt-6">
                <div class="flex items-center">
                    <input id="remember-me" name="remember-me" type="checkbox"
                        class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded cursor-pointer transition duration-150">
                    <label for="remember-me" class="ml-2 block text-sm text-gray-700 cursor-pointer"> Remember me
                    </label>
                </div>
                <div class="text-sm">
                    <a href="{{ url_for('auth.forgot_password') }}"
                        class="font-semibold text-blue-600 hover:text-blue-500 transition duration-150">
                        Forgot password?
                    </a>
                </div>
            </div>

            <!-- Submit Button -->
            <div class="pt-2">
                <button type="submit"
                    class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-md text-sm font-semibold text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all duration-200 transform hover:-translate-y-0.5">
                    Sign In
                </button>
            </div>
        </form>

        <!-- Registration Link -->
        <div class="mt-8 text-center border-t border-gray-100 pt-6">
            <p class="text-sm text-gray-600">
                Don't have an account?
                <a href="{{ url_for('auth.register') }}"
                    class="font-semibold text-blue-600 hover:text-blue-500 transition duration-150">
                    Register Now
                </a>
            </p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function togglePassword() {
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eye-icon');

        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            eyeIcon.classList.replace('ph-eye', 'ph-eye-slash');
        } else {
            passwordInput.type = 'password';
            eyeIcon.classList.replace('ph-eye-slash', 'ph-eye');
        }
    }
</script>
{% endblock %}
